name: Export TC32 objdump

on:
  push:
    branches:
      - stock-restore-v2-build
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream build files
        run: |
          wget -q https://github.com/romasku/tuya-zigbee-switch/archive/ec57f81b89e7755c4a8833cc6cb081ba3cdda227.tar.gz -O upstream.tar.gz
          mkdir upstream
          tar -xzf upstream.tar.gz --strip-components=1 -C upstream
      - name: Install exact SDK and TC32 toolchain
        working-directory: upstream/src/telink
        run: make -f tools.mk sdk toolchain
      - name: Show exact SDK OTA flash map
        run: |
          echo "=== drv_nv_cfg.h relevant lines ==="
          grep -n -E "FLASH_ADDR_OF_OTA_IMAGE|FLASH_OTA_IMAGE_MAX_SIZE|NV_BASE_ADDRESS|MAC_BASE_ADD|FACTORY_CFG_BASE_ADD|0x76000|0x77000" upstream/telink_tools/sdk/proj/drivers/drv_nv_cfg.h || true
          echo "=== end ==="

      - name: Collect objdump
        run: |
          mkdir -p out
          cp upstream/telink_tools/toolchain/tc32/bin/tc32-elf-objdump out/
          chmod +x out/tc32-elf-objdump
      - uses: actions/upload-artifact@v4
        with:
          name: tc32-objdump
          path: out/tc32-elf-objdump
